name: Release

# Builds binaries for every platform and publishes them as a GitHub Release.
# Trigger: any tag pushed that matches v* (e.g. v0.2.0).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  release:
    name: Test + build + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # `go test -race ./...` compiles internal/replay — needs CGO + libpcap
      # (gopacket/pcap). Without libpcap-dev the release build stays red.
      - name: Install libpcap (CGO dep for replay)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev

      # Every release is tested before shipping binaries.
      - name: Run tests
        run: go test -race ./...

      - name: Cross-compile and package
        run: |
          set -euo pipefail
          # Strip the leading "v" from the tag (v0.5.1 -> 0.5.1).
          version="${GITHUB_REF_NAME#v}"
          platforms=(darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64)
          mkdir -p dist/pkg
          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            suffix=""
            if [ "${os}" = "windows" ]; then suffix=".exe"; fi
            name="stress-strike-v${version}-${os}-${arch}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -buildvcs=false \
              -o "dist/pkg/stress-strike${suffix}" ./cmd/stress-strike
            if [ "${os}" = "windows" ]; then
              (cd dist/pkg && zip -q "../${name}.zip" "stress-strike${suffix}")
            else
              tar -czf "dist/${name}.tar.gz" -C dist/pkg "stress-strike"
            fi
            rm -f "dist/pkg/stress-strike${suffix}"
          done
          (
            cd dist
            sha256sum ./*.tar.gz ./*.zip > sha256sums.txt
            rm -rf pkg
          )
          echo "artifacts:"
          ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          generate_release_notes: true