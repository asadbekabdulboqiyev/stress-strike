name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.26"

jobs:
  # ---------------------------------------------------------------------------
  # lint — go vet + gofmt enforcement (fast feedback)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (vet + gofmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files found:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: all files formatted"

  # ---------------------------------------------------------------------------
  # test — race detector + coverage, coverage.out uploaded as artifact
  # ---------------------------------------------------------------------------
  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # build — cross-compile smoke test for the primary release platforms
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, arch: arm64 }
          - { os: linux,  arch: amd64 }
          - { os: windows, arch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cross-compile
        run: |
          suffix=""
          if [ "${{ matrix.os }}" = "windows" ]; then suffix=".exe"; fi
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -buildvcs=false \
            -o "dist/stress-strike-${{ matrix.os }}-${{ matrix.arch }}${suffix}" \
            ./cmd/stress-strike

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stress-strike-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/stress-strike-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # docker — multi-arch image build; PUSH only when a registry credential is
  # present (secrets.DOCKER_USERNAME) AND the event is a push to main/master.
  # No hardcoded credentials anywhere — everything comes from secrets.*.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker multi-arch (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # Push only on push events AND when registry credentials exist;
          # on PRs / without credentials this still builds (validation).
          push: ${{ github.event_name == 'push' && secrets.DOCKER_USERNAME != '' }}
          # Image name resolves to either the secret owner or "stress-strike".
          tags: |
            ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || 'stress-strike' }}/stress-strike:latest
            ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || 'stress-strike' }}/stress-strike:${{ github.sha }}