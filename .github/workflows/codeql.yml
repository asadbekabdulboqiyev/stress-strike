name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, so newly published advisories get checked even without a push.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Go gets the interesting analysis here: the load engine, the PCAP
        # replay parser and the fleet gRPC control plane all take untrusted
        # input. Also scan the shell/JS the repo ships so a compromised deploy
        # script is not a blind spot.
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: "1.26"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
          # stress-strike is a server *and* a CLI; the default/autobuild path
          # does not know to build ./cmd/..., so build explicitly.
          build-mode: ${{ matrix.language == 'go' && 'none' || 'none' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        if: matrix.language != 'go'

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
