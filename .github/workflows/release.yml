name: Release

# GoReleaser owns this pipeline. scripts/release.sh is deprecated: it produced
# 1 binary on 5 platforms, wrote to dist/ (which it first `rm -rf`'d, deleting
# the worker packages and the generated docker-compose file), and produced no
# SBOMs or signatures.
#
# Trigger: push a tag matching v*  (git tag v0.14.4 && git push origin v0.14.4)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # cosign keyless signing uses OIDC; attestations and id-token for provenance.
  id-token: write
  attestations: write
  packages: write

env:
  GO_VERSION: "1.26"
  GORELEASER_VERSION: "v2.5.1"

jobs:
  # ── gate: never ship a red tree ───────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Ensure the tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          echo "tag=$tag  VERSION=$file"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag $tag does not match VERSION file ($file) — bump VERSION before tagging"
            exit 1
          fi

      - name: Verify the committed version matches the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # internal/version and the three legacy `var version` declarations
          # must agree with VERSION, otherwise --version lies.
          found="$(grep -rhoE 'var (version|Version) = "0\.[0-9]+\.[0-9]+"' \
            cmd internal --include='*.go' | grep -oE '0\.[0-9]+\.[0-9]+' | sort -u | tr '\n' ' ')"
          echo "versions declared in source: $found"
          if [ -n "$found" ] && [ "$(echo "$found" | tr -d ' ' | tr ' ' '\n' | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::multiple versions declared in source: $found"
            exit 1
          fi
          for v in $found; do
            [ "$v" = "$tag" ] || { echo "::error::source declares $v but tag is $tag"; exit 1; }
          done

      - name: Tests (race)
        run: go test -race -timeout 20m ./...

      - name: go mod verify
        run: go mod verify

  # ── build + publish ───────────────────────────────────────────────────────
  release:
    name: GoReleaser
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Keep -trimpath and no cgo so the same tag produces byte-identical
    # binaries on any runner.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs tags + full history

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: goreleaser-*
          merge-multiple: true

      - name: Publish assets to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          gh release edit "${GITHUB_REF_NAME}" --latest || true

      - name: Summary
        run: |
          {
            echo "### Release ${GITHUB_REF_NAME}"
            echo
            echo '```'
            ls -lh dist/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
