name: Release

# Builds binaries for every platform and publishes them as a GitHub Release.
# Trigger: any tag pushed that matches v* (e.g. v0.2.0).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  release:
    name: Test + build + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Every release is tested before shipping binaries.
      - name: Run tests
        run: go test -race ./...

      - name: Cross-compile all platforms
        run: |
          set -euo pipefail
          # Strip the leading "v" from the tag (v0.2.0 -> 0.2.0).
          version="${GITHUB_REF_NAME#v}"
          platforms=(darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64)
          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            dir="dist/stress-strike-v${version}-${os}-${arch}"
            mkdir -p "$dir"
            suffix=""
            if [ "${os}" = "windows" ]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -buildvcs=false \
              -o "${dir}/stress-strike${suffix}" ./cmd/stress-strike
          done
          echo "artifacts:"
          find dist -type f -name 'stress-strike*' | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true