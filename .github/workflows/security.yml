name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── known-vulnerable dependencies ─────────────────────────────────────────
  # go.mod pins golang.org/x/crypto and golang.org/x/net; without this job a
  # CVE in either surfaces only when something breaks at runtime.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: govulncheck ./...
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"
          go-package: ./...
          # Symbol-level analysis, so unused-but-present vulnerable code does
          # not fail the build while reachable vulnerable code does.
          check-type: source

  # ── static security analysis ──────────────────────────────────────────────
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run gosec
        uses: securego/gosec@v2.29.0
        with:
          # -no-fail: the gate is the ratchet step below, which can tell a new
          # finding from one that predates this branch; a bare gosec failure
          # cannot. continue-on-error keeps the SARIF report even when gosec
          # itself exits non-zero, and the ratchet treats a missing or
          # unparsable report as a failure, so this cannot go quietly green.
          args: -no-fail -fmt sarif -out gosec.sarif ./...
        continue-on-error: true

      - name: Self-test the ratchet
        # A gate that cannot fail is not a gate: this proves the ratchet's own
        # logic (new finding fails, allowlisted rule passes, fixed finding
        # reported, unreadable input exits 2) against synthetic reports, before
        # it is allowed to gate anything.
        run: bash scripts/gosec-ratchet-test.sh

      - name: Ratchet gosec findings
        # Policy: a NEW error-level finding outside the G204/G304 allowlist fails
        # the build. The findings that predate the ratchet are frozen in
        # .gosec-baseline.json as debt — recorded, not accepted — so new code
        # cannot add one unnoticed, and this change does not block on 116
        # pre-existing findings. Identity is (ruleId, file, normalised source
        # line): line numbers move, so they are deliberately not part of it.
        #
        # G204/G304 (subprocess, file inclusion) are allowlisted because this
        # tool reads user-supplied pcap/report paths by design and never spawns
        # a shell from untrusted input. G115, G114, G402 &c. in the baseline are
        # real debt: fix them when you touch the code, and do not add to them.
        #
        # NOTE: the script reads SARIF's `ruleId` (camelCase). Reading `.rule_id`
        # yields null for every result, which is how an earlier revision of this
        # step managed to report "no blocking findings" whatever gosec found.
        run: bash scripts/gosec-ratchet.sh gosec.sarif

  # ── secret leakage ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── container images ──────────────────────────────────────────────────────
  trivy:
    name: Trivy (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [stress-strike, stress-strike-master, stress-strike-worker]
        include:
          - image: stress-strike
            dockerfile: Dockerfile
          - image: stress-strike-master
            dockerfile: Dockerfile.master
          - image: stress-strike-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image to scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:scan
          build-args: |
            VERSION=scan

      - name: Scan filesystem + image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln,misconfig,secret

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # ── container images: enforcing gate ──────────────────────────────────────
  # The `trivy` job above uploads SARIF but never fails the build (no
  # exit-code), so a fixable HIGH/CRITICAL vuln only shows up in the Security
  # tab. This job is the gate: it builds each image locally (`load: true`) and
  # exits non-zero on any fixable HIGH/CRITICAL vulnerability, committed secret
  # or misconfiguration, while still uploading the findings as SARIF.
  trivy-image:
    name: Trivy gate (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: stress-strike
            dockerfile: Dockerfile
          - image: stress-strike-master
            dockerfile: Dockerfile.master
          - image: stress-strike-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image to scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:gate
          build-args: |
            VERSION=scan

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ matrix.image }}:gate
          format: sarif
          output: trivy-image-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}

  # ── dependency review on PRs ──────────────────────────────────────────────
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
