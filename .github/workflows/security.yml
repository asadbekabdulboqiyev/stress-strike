name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── known-vulnerable dependencies ─────────────────────────────────────────
  # go.mod pins golang.org/x/crypto and golang.org/x/net; without this job a
  # CVE in either surfaces only when something breaks at runtime.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: govulncheck ./...
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"
          go-package: ./...
          # Symbol-level analysis, so unused-but-present vulnerable code does
          # not fail the build while reachable vulnerable code does.
          check-type: source

  # ── static security analysis ──────────────────────────────────────────────
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
        continue-on-error: true

      - name: Report gosec findings
        run: |
          set -euo pipefail
          # G204/G304 (subprocess, file inclusion) are expected in a tool that
          # shells out to nothing but legitimately reads user-supplied pcap
          # and report paths; they are recorded as warnings, not gates.
          #
          # This step counts and annotates the remaining error-level findings.
          # It deliberately does NOT fail the build: `main` carries pre-existing
          # HIGH findings that are expected here (G115 bounds-checked integer
          # conversions, G114 example servers without timeouts, G402 example
          # clients, ...), and ratcheting this into a gate is a policy decision
          # for the maintainer, not something a drive-by edit should decide.
          # To ratchet: add the rules you accept to the allowlist regex below
          # and change the final `exit 0` to `exit 1`.
          #
          # NOTE: gosec's SARIF spells the field `ruleId` (camelCase). An
          # earlier revision of this step read `.rule_id`, which is always null;
          # `null | test(...)` is a jq type error, so under `set -e` the `if`
          # took its else-branch and the step reported "no blocking findings"
          # whatever gosec found — a permanently green gate. Reading the real
          # field fixes that; a malformed report now aborts the step loudly
          # (set -e) instead of passing.
          findings=$(jq '[.runs[].results[] | select(.level=="error")
                          | .ruleId | select(test("^(G204|G304)$") | not)]' gosec.sarif)
          count=$(jq 'length' <<<"$findings")
          if [ "$count" -gt 0 ]; then
            rules=$(jq -r 'group_by(.) | map("\(.[0])=\(length)") | join(", ")' <<<"$findings")
            echo "::warning title=gosec::$count error-level finding(s) outside the G204/G304 allowlist: $rules"
          fi
          echo "gosec: $count error-level finding(s) outside the G204/G304 allowlist (reported, not blocking)"
          exit 0

  # ── secret leakage ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── container images ──────────────────────────────────────────────────────
  trivy:
    name: Trivy (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [stress-strike, stress-strike-master, stress-strike-worker]
        include:
          - image: stress-strike
            dockerfile: Dockerfile
          - image: stress-strike-master
            dockerfile: Dockerfile.master
          - image: stress-strike-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image to scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:scan
          build-args: |
            VERSION=scan

      - name: Scan filesystem + image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln,misconfig,secret

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # ── container images: enforcing gate ──────────────────────────────────────
  # The `trivy` job above uploads SARIF but never fails the build (no
  # exit-code), so a fixable HIGH/CRITICAL vuln only shows up in the Security
  # tab. This job is the gate: it builds each image locally (`load: true`) and
  # exits non-zero on any fixable HIGH/CRITICAL vulnerability, committed secret
  # or misconfiguration, while still uploading the findings as SARIF.
  trivy-image:
    name: Trivy gate (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: stress-strike
            dockerfile: Dockerfile
          - image: stress-strike-master
            dockerfile: Dockerfile.master
          - image: stress-strike-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image to scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:gate
          build-args: |
            VERSION=scan

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ matrix.image }}:gate
          format: sarif
          output: trivy-image-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}

  # ── dependency review on PRs ──────────────────────────────────────────────
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
