version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gosec:
      # G104 (unhandled errors) is covered by errcheck; duplicate rules just
      # slow the linter down.
      excludes:
        - G104
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    rules:
      # Tests legitimately ignore errors and use magic numbers.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
      # Detector signatures and reference URLs (OWASP/WSTG/MDN/RFC links, PSV-*
      # check IDs, A0*-category labels, the ss-canary.invalid canary hostname,
      # the root:x:0:0: /etc/passwd detection signature). These are intentional
      # non-secret strings that pattern-match gosec G101. They are reviewed
      # false positives frozen in .gosec-baseline.json; the dedicated `security`
      # CI job still runs full gosec (ratchet) over every file.
      - path: internal/scanner/(checks_passive|intrusive)\.go
        linters:
          - gosec
      # Generated protobuf code.
      - path: \.pb\.go$
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/asadbekabdulboqiyev/stress-strike

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
