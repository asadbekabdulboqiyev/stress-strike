version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gosec:
      # G104 (unhandled errors) is covered by errcheck; duplicate rules just
      # slow the linter down.
      excludes:
        - G104
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    rules:
      # Tests legitimately ignore errors and use magic numbers.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
      # Generated protobuf code.
      - path: \.pb\.go$
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/asadbekabdulboqiyev/stress-strike

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
