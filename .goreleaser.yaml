# GoReleaser config for stress-strike.
#
# Replaces scripts/release.sh + .github/workflows/release.yml with one
# deterministic source of truth. Every binary, every platform, checksums,
# SPDX + CycloneDX SBOMs and cosign signatures are produced here.
#
# Requires GoReleaser >= 2.5 for `sboms` and `signs`.

version: 2

project_name: stress-strike

# Every binary is pure Go: internal/replay reads PCAP through gopacket/pcapgo,
# not gopacket/pcap, so no CGO and no libpcap anywhere in the release matrix.
env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod tidy
    - go mod verify

# ── Builds: 6 binaries x {linux,darwin,windows} x {amd64,arm64} ──────────────
# The ldflags target the shared internal/version package, so all six binaries
# report the same version. The extra -X main.version=... keeps the three mains
# that still declare their own `var version` (stress-strike, -master, -worker)
# working during the migration; it is a harmless no-op elsewhere.
builds:
  - id: stress-strike
    main: ./cmd/stress-strike
    binary: stress-strike
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Date={{ .CommitDate }}

  - id: stress-strike-dashboard
    main: ./cmd/stress-strike-dashboard
    binary: stress-strike-dashboard
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Date={{ .CommitDate }}

  - id: stress-strike-master
    main: ./cmd/stress-strike-master
    binary: stress-strike-master
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Date={{ .CommitDate }}

  - id: stress-strike-worker
    main: ./cmd/stress-strike-worker
    binary: stress-strike-worker
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Date={{ .CommitDate }}

  - id: stress-strike-replay
    main: ./cmd/stress-strike-replay
    binary: stress-strike-replay
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Date={{ .CommitDate }}

  - id: stress-strike-scan
    main: ./cmd/stress-strike-scan
    binary: stress-strike-scan
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/stress-strike/internal/version.Date={{ .CommitDate }}

# ── Archives: one per binary per platform ───────────────────────────────────
# LICENSE and NOTICE are mandatory in every archive: stress-strike is
# Apache-2.0, and §4 requires recipients of a binary to receive the license
# text and the attribution notices with it.
archives:
  - id: stress-strike
    ids: [stress-strike]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - NOTICE
      - README.md
      - src: SECURITY.md

  - id: stress-strike-dashboard
    ids: [stress-strike-dashboard]
    name_template: "{{ .ProjectName }}-dashboard_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - NOTICE

  - id: stress-strike-master
    ids: [stress-strike-master]
    name_template: "{{ .ProjectName }}-master_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - NOTICE
      - src: docs/DISTRIBUTED.md

  # The worker package carries the systemd unit + env template so a fresh
  # host can be bootstrapped from the tarball alone (matches
  # scripts/build-worker-linux.sh).
  - id: stress-strike-worker
    ids: [stress-strike-worker]
    name_template: "{{ .ProjectName }}-worker_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - NOTICE
      - src: deploy/systemd/stress-strike-worker.service
        dst: stress-strike-worker.service
      - src: deploy/systemd/worker.env.example
        dst: worker.env.example
      - src: docs/DISTRIBUTED.md

  - id: stress-strike-replay
    ids: [stress-strike-replay]
    name_template: "{{ .ProjectName }}-replay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - NOTICE

  - id: stress-strike-scan
    ids: [stress-strike-scan]
    name_template: "{{ .ProjectName }}-scan_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - NOTICE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# ── SBOM: SPDX + CycloneDX for every archive ────────────────────────────────
sboms:
  - id: spdx
    artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.spdx.json"]
  - id: cyclonedx
    artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.cdx.json"]

# ── cosign keyless signatures over checksums + SBOMs ───────────────────────
# Uses GitHub OIDC, so there is no long-lived signing key to leak.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: sbom
    output: true

# ── Deb/RPM for the systemd story (license + NOTICE must ship too) ──────────
nfpms:
  - id: packages
    ids: [stress-strike]
    package_name: stress-strike
    formats: [deb, rpm]
    maintainer: stress-strike maintainers <maintainers@stress-strike.invalid>
    description: Distributed load testing and network simulator written in Go
    license: Apache-2.0
    vendor: stress-strike
    homepage: https://github.com/asadbekabdulboqiyev/stress-strike
    format_overrides:
      - goos: windows
        format: zip
    bindir: /usr/local/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/stress-strike/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/stress-strike/NOTICE
      - src: README.md
        dst: /usr/share/doc/stress-strike/README.md

# ── Homebrew formula + Scoop manifest, auto-updated on release ─────────────
release:
  prerelease: auto
  footer: |
    ## Verifying this release

    ```
    sha256sum -c checksums.txt --ignore-missing
    cosign verify-blob \
      --certificate stress-strike_<version>_linux_amd64.tar.gz.pem \
      --signature     stress-strike_<version>_linux_amd64.tar.gz.sig \
      stress-strike_<version>_linux_amd64.tar.gz
    ```

    SPDX and CycloneDX SBOMs ship next to every archive.
