# GoReleaser config for Sift.
#
# Replaces scripts/release.sh + .github/workflows/release.yml with one
# deterministic source of truth. Every binary, every platform, checksums,
# SPDX + CycloneDX SBOMs and cosign signatures are produced here.
#
# Requires GoReleaser >= 2.5 for `sboms` and `signs`.

version: 2

project_name: Sift

# Every binary is pure Go: internal/replay reads PCAP through gopacket/pcapgo,
# not gopacket/pcap, so no CGO and no libpcap anywhere in the release matrix.
env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod tidy
    - go mod verify

# ── Builds: 6 binaries x {linux,darwin,windows} x {amd64,arm64} ──────────────
# The ldflags target the shared internal/version package, so all six binaries
# report the same version. The master and worker also stamp the coordinator's
# control-plane version, which the ping response advertises.
#
# There is no -X main.version any more: no main declares a `var version` any
# more, so the flag was a no-op that only made the config look busier than it
# was.
builds:
  - id: Sift
    main: ./cmd/sift
    binary: Sift
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Date={{ .CommitDate }}

  - id: Sift-dashboard
    main: ./cmd/sift-dashboard
    binary: Sift-dashboard
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Date={{ .CommitDate }}

  - id: Sift-master
    main: ./cmd/sift-master
    binary: Sift-master
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/dist/coordinator.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Date={{ .CommitDate }}

  - id: Sift-worker
    main: ./cmd/sift-worker
    binary: Sift-worker
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/dist/coordinator.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Date={{ .CommitDate }}

  - id: Sift-replay
    main: ./cmd/sift-replay
    binary: Sift-replay
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Date={{ .CommitDate }}

  - id: Sift-scan
    main: ./cmd/sift-scan
    binary: Sift-scan
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Version={{ .Version }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Commit={{ .FullCommit }}
      - -X github.com/asadbekabdulboqiyev/sift/internal/version.Date={{ .CommitDate }}

# ── Archives: one per binary per platform ───────────────────────────────────
# LICENSE and NOTICE are mandatory in every archive: Sift is
# Apache-2.0, and §4 requires recipients of a binary to receive the license
# text and the attribution notices with it.
archives:
  - id: Sift
    builds: [Sift]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

    files:
      - LICENSE
      - NOTICE
      - README.md
      - src: SECURITY.md

  - id: Sift-dashboard
    builds: [Sift-dashboard]
    name_template: "{{ .ProjectName }}-dashboard_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

    files:
      - LICENSE
      - NOTICE

  - id: Sift-master
    builds: [Sift-master]
    name_template: "{{ .ProjectName }}-master_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

    files:
      - LICENSE
      - NOTICE
      - src: docs/DISTRIBUTED.md

  # The worker package carries the systemd unit + env template so a fresh
  # host can be bootstrapped from the tarball alone (matches
  # scripts/build-worker-linux.sh).
  - id: Sift-worker
    builds: [Sift-worker]
    name_template: "{{ .ProjectName }}-worker_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

    files:
      - LICENSE
      - NOTICE
      - src: deploy/systemd/Sift-worker.service
        dst: Sift-worker.service
      - src: deploy/systemd/worker.env.example
        dst: worker.env.example
      - src: docs/DISTRIBUTED.md

  - id: Sift-replay
    builds: [Sift-replay]
    name_template: "{{ .ProjectName }}-replay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

    files:
      - LICENSE
      - NOTICE

  - id: Sift-scan
    builds: [Sift-scan]
    name_template: "{{ .ProjectName }}-scan_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

    files:
      - LICENSE
      - NOTICE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# ── SBOM: SPDX + CycloneDX for every archive ────────────────────────────────
sboms:
  - id: spdx
    artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.spdx.json"]
  - id: cyclonedx
    artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.cdx.json"]

# ── cosign keyless signatures over checksums + SBOMs ───────────────────────
# Uses GitHub OIDC, so there is no long-lived signing key to leak.
signs:
  - id: checksum-sign
    cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

  - id: sbom-sign
    cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: sbom
    output: true

# ── Deb/RPM for the systemd story (license + NOTICE must ship too) ──────────
nfpms:
  - id: packages
    builds: [Sift]
    package_name: Sift
    formats: [deb, rpm]
    maintainer: Sift maintainers <maintainers@Sift.invalid>
    description: Distributed load testing and network simulator written in Go
    license: Apache-2.0
    vendor: Sift
    homepage: https://github.com/asadbekabdulboqiyev/sift

    bindir: /usr/local/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/Sift/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/Sift/NOTICE
      - src: README.md
        dst: /usr/share/doc/Sift/README.md

# ── Homebrew formula + Scoop manifest, auto-updated on release ─────────────
release:
  prerelease: auto
  footer: |
    ## Verifying this release

    ```
    sha256sum -c checksums.txt --ignore-missing
    cosign verify-blob \
      --certificate Sift_<version>_linux_amd64.tar.gz.pem \
      --signature     Sift_<version>_linux_amd64.tar.gz.sig \
      Sift_<version>_linux_amd64.tar.gz
    ```

    SPDX and CycloneDX SBOMs ship next to every archive.
