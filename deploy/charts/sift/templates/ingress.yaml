{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "Sift.fullname" . }}{{- if .Values.ingress.nameSuffix }}-{{ .Values.ingress.nameSuffix }}{{- end }}
  labels:
    {{- include "Sift.commonLabels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- if .secretName }}
      secretName: {{ .secretName }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .serviceName | default (printf "%s-master" (include "Sift.fullname" $)) }}
                port:
                  {{- if .servicePortName }}
                  name: {{ .servicePortName }}
                  {{- else }}
                  number: {{ .servicePort | default $.Values.service.port }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
