apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stress-strike.fullname" . }}-master
spec:
  replicas: {{ .Values.master.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "stress-strike.fullname" . }}-master
  template:
    metadata:
      labels:
        app: {{ include "stress-strike.fullname" . }}-master
    spec:
      containers:
        - name: master
          image: "{{ .Values.master.image.repository }}:{{ .Values.master.image.tag }}"
          imagePullPolicy: {{ .Values.master.image.pullPolicy }}
          command: ["stress-strike", "master"]
          ports:
            - containerPort: 8080
