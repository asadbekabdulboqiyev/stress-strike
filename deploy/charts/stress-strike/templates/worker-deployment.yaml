apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stress-strike.fullname" . }}-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "stress-strike.fullname" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "stress-strike.fullname" . }}-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["stress-strike", "worker"]
