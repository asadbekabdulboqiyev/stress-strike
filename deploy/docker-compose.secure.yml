# docker-compose.secure.yml — hardened overlay for Sift compose deployments.
#
# Focus: TLS termination/HTTPS and safer public exposure of the dashboard via a
# reverse proxy. This overlay adds Caddy as a TLS-terminating proxy and applies
# additional container hardening options where compatible.
#
# Usage:
#   1) Edit deploy/reverse-proxy/Caddyfile (set your real domain)
#   2) Ensure DNS points to this host and ports 80/443 are reachable
#   3) Start with base + secure overlay:
#        docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.secure.yml up -d --build
#
# Notes:
#   - The dashboard is NOT published directly to the host in this overlay; access
#     it via Caddy (HTTPS). Keep admin/control access restricted (IP allowlists,
#     auth tokens, VPN, etc.).
#   - Master/worker gRPC ports are still published in the base compose for fleet
#     workflows; restrict them with firewall rules/security groups in production.
#   - Review all credentials/tokens and replace sample values before deployment.

services:
  # Remove direct host exposure of dashboard; route through Caddy instead.
  dashboard:
    ports: []
    # Extra hardening (compatible with the alpine-based dashboard image)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Keep restart policy from base compose

  # TLS-terminating reverse proxy (automatic HTTPS via Let's Encrypt when domain is valid)
  caddy:
    image: caddy:2.8-alpine
    depends_on:
      dashboard:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - strike
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
