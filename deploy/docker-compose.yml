# docker-compose.yml — containerized Sift fleet for a single host
# that runs Docker. Use this when you want master + workers in containers
# instead of systemd on separate VPS boxes.
#
# Build (once):
#   docker compose -f deploy/docker-compose.yml build
#
# Run:
#   docker compose -f deploy/docker-compose.yml up -d
#
# The workers self-register with the master. This compose setup starts the
# master with a sample run configuration and waits for the workers to join;
# adjust -url/-users/-duration/-wait-workers as needed for your environment.
#
# IMPORTANT: the default bridge network adds NAT; for maximum connection
# counts use `network_mode: host` and expose the ports appropriately. The
# compose file below keeps it simple and functional.
#
# Health: master/worker images expose HTTP ops endpoints (/healthz, /readyz,
# /metrics) via -http-addr and provide a `healthcheck` subcommand for
# distroless-friendly probes. Dashboard uses its own /healthz endpoint.
# Workers depend on `master: condition: service_healthy` before starting.

services:
  master:
    build:
      context: ..
      dockerfile: Dockerfile.master
    command:
      - /usr/local/bin/Sift-master
      - -listen
      - 0.0.0.0:50051
      # HTTP ops server: /healthz, /readyz, /metrics
      - -http-addr
      - 0.0.0.0:9090
      - -url
      - ${SIFT_URL:-http://example.com}
      - -users
      - "20"
      - -duration
      - "30"
      - -wait-workers
      - "2"
      - -wait-timeout
      - "60"
    environment:
      - SIFT_TOKEN=${SIFT_TOKEN:-}
    ports:
      - "50051:50051"
      # Exposes /healthz, /readyz and /metrics to the host (Prometheus).
      - "9090:9090"
    deploy:
      resources:
        reservations:
          memory: 256m
        limits:
          memory: 512m
          cpus: "1.0"
    # The master image is distroless (no shell, no wget/curl), so the probe uses
    # the built-in `healthcheck` subcommand.
    healthcheck:
      test: ["CMD", "/usr/local/bin/Sift-master", "healthcheck", "--addr", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - strike
    restart: unless-stopped

  worker-1:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    command:
      - /usr/local/bin/Sift-worker
      - -listen
      - 0.0.0.0:50061
      # HTTP ops server: /healthz, /readyz, /metrics
      - -http-addr
      - 0.0.0.0:9091
      - -id
      - docker-worker-1
      - -advertise
      - "worker-1:50061"
      - -master
      - "master:50051"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    deploy:
      resources:
        reservations:
          memory: 256m
        limits:
          memory: 512m
          cpus: "1.0"
    # distroless image: probe via the worker binary's `healthcheck` subcommand.
    healthcheck:
      test: ["CMD", "/usr/local/bin/Sift-worker", "healthcheck", "--addr", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # A worker is useless until the master is up and able to accept it.
    depends_on:
      master:
        condition: service_healthy
    networks:
      - strike
    restart: unless-stopped

  worker-2:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    command:
      - /usr/local/bin/Sift-worker
      - -listen
      - 0.0.0.0:50061
      - -http-addr
      - 0.0.0.0:9091
      - -id
      - docker-worker-2
      - -advertise
      - "worker-2:50061"
      - -master
      - "master:50051"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    deploy:
      resources:
        reservations:
          memory: 256m
        limits:
          memory: 512m
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "/usr/local/bin/Sift-worker", "healthcheck", "--addr", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      master:
        condition: service_healthy
    networks:
      - strike
    restart: unless-stopped

  # Standalone real-time web dashboard (all-in-one alpine image, so a shell
  # probe is available).
  #
  # The control API (start/stop real load runs) is UNAUTHENTICATED here, so the
  # port is published to the host loopback only AND the server is started with
  # -insecure, the explicit acknowledgement required before it will bind a
  # non-loopback address without credentials. To expose it on a real interface,
  # enroll a credential instead of -insecure:
  #   command: [-listen, 0.0.0.0:8888, -auth-token, ${SIFT_DASH_TOKEN:?}]
  #
  # entrypoint is overridden so the dashboard binary is PID 1: the image's
  # default `Sift dashboard ...` dispatcher forks a child process and
  # does not forward SIGTERM to it, which would defeat graceful shutdown.
  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/Sift-dashboard"]
    command:
      - -listen
      - 0.0.0.0:8888
      - -insecure
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - strike
    restart: unless-stopped

networks:
  strike:
    driver: bridge