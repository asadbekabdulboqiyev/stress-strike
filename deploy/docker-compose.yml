# docker-compose.yml — containerized stress-strike fleet for a single host
# that runs Docker. Use this when you want master + workers in containers
# instead of systemd on separate VPS boxes.
#
# Build (once):
#   docker compose -f deploy/docker-compose.yml build
#
# Run:
#   docker compose -f deploy/docker-compose.yml up -d
#
# The workers self-register with the master via auto-discovery. Start a run
# from the master container:
#   docker compose -f deploy/docker-compose.yml exec master \
#     /usr/local/bin/stress-strike-master -listen 0.0.0.0:50051 \
#       -wait-workers 2 -wait-timeout 30 \
#       -url https://example.com -users 500 -duration 60
#
# IMPORTANT: the default bridge network adds NAT; for maximum connection
# counts use `network_mode: host` and expose the ports appropriately. The
# compose file below keeps it simple and functional.
#
# Health: every service declares an HTTP healthcheck against its /healthz
# endpoint (master :9090, worker :9091, dashboard :8888) and the workers wait
# for `master: condition: service_healthy` before starting.
#
# TODO(lead): this file needs TWO changes in cmd/stress-strike-master|worker,
# neither of which exists yet:
#   1. an HTTP health/metrics server bound via `-http-addr` (defaults :9090 /
#      :9091) serving GET /healthz, /readyz and /metrics; and
#   2. a `healthcheck --addr <url>` subcommand (exits 0 on 2xx). `stress-strike
#      healthcheck` already exists on the all-in-one binary but NOT on the
#      master/worker standalone binaries used by this file.
# Until (2) lands the master never reports healthy, so the workers (which wait
# on `service_healthy`) will not start.

services:
  master:
    build:
      context: ..
      dockerfile: Dockerfile.master
    command:
      - /usr/local/bin/stress-strike-master
      - -listen
      - 0.0.0.0:50051
      # HTTP health/metrics server: /healthz, /readyz, /metrics
      # (see the header note: the master `-http-addr` flag is not implemented yet).
      - -http-addr
      - 0.0.0.0:9090
      - -url
      - ${STRESS_STRIKE_URL:-http://example.com}
      - -users
      - "20"
      - -duration
      - "30"
      - -wait-workers
      - "2"
      - -wait-timeout
      - "60"
    environment:
      - STRESS_STRIKE_TOKEN=${STRESS_STRIKE_TOKEN:-}
    ports:
      - "50051:50051"
      # Exposes /healthz, /readyz and /metrics to the host (Prometheus).
      - "9090:9090"
    # The master image is distroless (no shell, no wget/curl), so the probe has
    # to be the binary itself (see the header note: the `healthcheck`
    # subcommand does not exist on this binary yet, so it never reports
    # healthy and the workers below, which wait on `service_healthy`, block).
    healthcheck:
      test: ["CMD", "/usr/local/bin/stress-strike-master", "healthcheck", "--addr", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - strike
    restart: unless-stopped

  worker-1:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    command:
      - /usr/local/bin/stress-strike-worker
      - -listen
      - 0.0.0.0:50061
      # HTTP health/metrics server: /healthz, /readyz, /metrics
      # (see the header note: the worker `-http-addr` flag is not implemented yet).
      - -http-addr
      - 0.0.0.0:9091
      - -id
      - docker-worker-1
      - -advertise
      - "worker-1:50061"
      - -master
      - "master:50051"
      - -token
      - ${STRESS_STRIKE_TOKEN:-}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    # distroless image: probe via the worker binary, not a shell
    # (see the header note: the `healthcheck` subcommand is not implemented yet).
    healthcheck:
      test: ["CMD", "/usr/local/bin/stress-strike-worker", "healthcheck", "--addr", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # A worker is useless until the master is up and able to accept it.
    depends_on:
      master:
        condition: service_healthy
    networks:
      - strike
    restart: unless-stopped

  worker-2:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    command:
      - /usr/local/bin/stress-strike-worker
      - -listen
      - 0.0.0.0:50061
      - -http-addr
      - 0.0.0.0:9091
      - -id
      - docker-worker-2
      - -advertise
      - "worker-2:50061"
      - -master
      - "master:50051"
      - -token
      - ${STRESS_STRIKE_TOKEN:-}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD", "/usr/local/bin/stress-strike-worker", "healthcheck", "--addr", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      master:
        condition: service_healthy
    networks:
      - strike
    restart: unless-stopped

  # Standalone real-time web dashboard (all-in-one alpine image, so a shell
  # probe is available).
  #
  # The control API (start/stop real load runs) is UNAUTHENTICATED here, so the
  # port is published to the host loopback only AND the server is started with
  # -insecure, the explicit acknowledgement required before it will bind a
  # non-loopback address without credentials. To expose it on a real interface,
  # enroll a credential instead of -insecure:
  #   command: [-listen, 0.0.0.0:8888, -auth-token, ${STRESS_STRIKE_DASH_TOKEN:?}]
  #
  # entrypoint is overridden so the dashboard binary is PID 1: the image's
  # default `stress-strike dashboard ...` dispatcher forks a child process and
  # does not forward SIGTERM to it, which would defeat graceful shutdown.
  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/stress-strike-dashboard"]
    command:
      - -listen
      - 0.0.0.0:8888
      - -insecure
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - strike
    restart: unless-stopped

networks:
  strike:
    driver: bridge