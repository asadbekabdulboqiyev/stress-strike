apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: Sift-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: Sift-worker
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
