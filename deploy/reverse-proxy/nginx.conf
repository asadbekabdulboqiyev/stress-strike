# Nginx reverse proxy for Sift dashboard with TLS termination (HTTPS).
#
# Requirements:
#   - Valid TLS certificate/key (e.g. Let's Encrypt via certbot)
#   - DNS name pointing to this host and ports 80/443 open
#   - Dashboard reachable from nginx (default upstream: dashboard:8888)
#
# Certbot example (after placing this config and reloading nginx):
#   certbot --nginx -d dashboard.example.com
#
# Notes:
#   - Dashboard uses WebSockets; Upgrade/Connection headers are required.
#   - Keep dashboard bound to an internal interface when exposed via proxy.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sift_dashboard {
    server dashboard:8888;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.example.com;

    # Replace with your certificate paths
    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;

    # TLS hardening (review against your compliance baseline)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Optional: basic access controls / IP allowlists can be added here
    # allow 203.0.113.0/24;
    # deny all;

    client_max_body_size 32m; # aligns with dashboard upload limits; adjust as needed

    location / {
        proxy_pass http://sift_dashboard;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
