{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="VoltStore — premium tech store demo target. Real-world e-commerce standards, VeriGate-protected.">
<title>{{.Title}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>V</text></svg>">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><span class="brand-mark">V</span>VoltStore</a>
    <div class="nav-links">
      <a href="/" {{if eq .Title "VoltStore — Premium Tech Store"}}class="active"{{end}}>Home</a>
      <a href="/products" {{if and (ne .Title "VoltStore — Premium Tech Store") (not .Product)}}class="active"{{end}}>Catalog</a>
      {{if .User}}<a href="/account">Account</a>{{end}}
    </div>
    <div class="nav-actions">
      <a class="icon-btn" href="/cart" aria-label="Cart" title="Cart">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1.4"/><circle cx="19" cy="21" r="1.4"/>
          <path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L22 7H6"/>
        </svg>
        <span class="cart-badge {{if eq .CartCount 0}}hidden{{end}}" data-cart-count>{{.CartCount}}</span>
      </a>
      {{if .User}}
        <span class="muted" style="font-size:13px;">Hi, {{.User.Name}}</span>
        <button class="btn btn-sm" id="logout-btn">Sign out</button>
      {{else}}
        <a class="btn btn-sm" href="/login">Sign in</a>
        <a class="btn btn-sm btn-primary" href="/register">Register</a>
      {{end}}
    </div>
  </div>
</nav>
<main class="main">
{{end}}

{{define "foot"}}
</main>
<footer class="footer">
  <div class="footer-inner">
    <span>VoltStore — stress-strike demo target</span>
    <span class="mono">v0.14.0 · VeriGate middleware</span>
  </div>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
{{end}}
