syntax = "proto3";

package stressstrike.dist;

option go_package = "stress-strike/internal/dist/proto;distproto";

// Master -> Worker commands
message WorkerCommand {
  oneof payload {
    StartRun      start_run      = 1;
    StopRun       stop_run       = 2;
    GetStatus     get_status     = 3;
    MigrateSession migrate_session = 4;
  }
}

message StartRun {
  string run_id = 1;
  Scenario scenario = 2;
  int32 worker_index = 3;
  int32 total_workers = 4;
  string master_addr = 5;  // for streaming results back
}

message StopRun {
  string run_id = 1;
  bool graceful = 2;
}

message GetStatus {}

message MigrateSession {
  string session_id = 1;
  string target_worker = 2;
  bytes session_data = 3;
}

// Worker -> Master responses/streaming
message WorkerEvent {
  oneof payload {
    RunStarted    run_started    = 1;
    RunProgress   run_progress   = 2;
    RunCompleted  run_completed  = 3;
    RunFailed     run_failed     = 4;
    StatusReport  status_report  = 5;
    SessionMigrated session_migrated = 6;
  }
}

message RunStarted {
  string run_id = 1;
  int64 timestamp = 2;
}

message RunProgress {
  string run_id = 1;
  int64 timestamp = 2;
  TelemetrySnapshot telemetry = 3;
}

message RunCompleted {
  string run_id = 1;
  int64 timestamp = 2;
  Report report = 3;
}

message RunFailed {
  string run_id = 1;
  int64 timestamp = 2;
  string error = 3;
}

message StatusReport {
  string worker_id = 1;
  bool healthy = 2;
  int64 active_runs = 3;
  SystemMetrics system = 4;
}

message SessionMigrated {
  string session_id = 1;
  bool success = 2;
}

// Scenario definition (matches internal config)
message Scenario {
  string name = 1;
  string base_url = 2;
  LoadProfile profile = 3;
  repeated Step steps = 4;
  map<string, string> variables = 5;
  SLA sla = 6;
}

message LoadProfile {
  string type = 1;
  int32 users = 2;
  int32 duration = 3;
  int32 ramp_up = 4;
  int32 spike_users = 5;
  int32 spike_warmup = 6;
  int32 spike_hold = 7;
  int32 wave_period = 8;
  int32 rps = 9;
  int32 timeout = 10;
  bool keep_alive = 11;
  int32 target_rps = 12;
  string tls_fingerprint = 13;
}

message Step {
  string name = 1;
  string type = 2;  // http, ws, grpc, tcp, udp
  string method = 3;
  string url = 4;
  map<string, string> headers = 5;
  string body = 6;
  repeated Extract extract = 7;
  repeated Assertion assertions = 8;
  int32 timeout = 9;
  string frame_type = 10;
  string grpc_method = 11;
  bool await_response = 12;
  bool session = 13;
}

message Extract {
  string name = 1;
  string from = 2;
  string path = 3;
}

message Assertion {
  string type = 1;
  string value = 2;
}

message SLA {
  double max_p99_ms = 1;
  double max_avg_ms = 2;
  double max_error_rate_pct = 3;
  double min_rps = 4;
}

// Telemetry snapshot for streaming
message TelemetrySnapshot {
  int64 timestamp = 1;
  int64 elapsed_ms = 2;
  int64 total_requests = 3;
  int64 total_errors = 4;
  double rps = 5;
  int64 active_users = 6;
  map<int32, int64> status_codes = 7;
  map<string, int64> error_types = 8;
  LatencyPercentiles latency = 9;
  repeated StepTelemetry steps = 10;
}

message LatencyPercentiles {
  int64 p50_ms = 1;
  int64 p95_ms = 2;
  int64 p99_ms = 3;
  int64 avg_ms = 4;
  int64 min_ms = 5;
  int64 max_ms = 6;
}

message StepTelemetry {
  string name = 1;
  int64 requests = 2;
  int64 errors = 3;
  LatencyPercentiles latency = 4;
  map<int32, int64> status_codes = 5;
  map<string, int64> error_types = 6;
}

message SystemMetrics {
  double cpu_percent = 1;
  int64 memory_bytes = 2;
  int64 goroutines = 3;
  int64 open_fds = 4;
}

// Final report
message Report {
  string name = 1;
  string base_url = 2;
  string load_profile = 3;
  int64 started_at = 4;
  int64 ended_at = 5;
  int64 duration_ms = 6;
  int64 active_users = 7;
  int64 total_requests = 8;
  int64 total_errors = 9;
  double error_rate_pct = 10;
  double rps = 11;
  map<int32, int64> status_codes = 12;
  map<string, int64> errors = 13;
  StepReport overall = 14;
  repeated StepReport steps = 15;
  repeated SLAResult sla = 16;
  repeated TimelineSample timeline = 17;
}

message StepReport {
  string name = 1;
  int64 requests = 2;
  int64 errors = 3;
  map<int32, int64> status_codes = 4;
  map<string, int64> error_types = 5;
  int64 min_ms = 6;
  int64 avg_ms = 7;
  int64 max_ms = 8;
  int64 p50_ms = 9;
  int64 p95_ms = 10;
  int64 p99_ms = 11;
}

message SLAResult {
  string metric = 1;
  string target = 2;
  string actual = 3;
  bool pass = 4;
}

message TimelineSample {
  int32 second = 1;
  int64 requests_total = 2;
  int64 requests_delta = 3;
  int64 errors_total = 4;
  int64 errors_delta = 5;
  int64 active_users = 6;
}

// gRPC Service
service MasterWorker {
  // Bidirectional streaming for long-running coordination
  rpc Coordinate(stream WorkerCommand) returns (stream WorkerEvent);
  
  // Unary for simple queries
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesResponse);

  // Worker self-registration for auto-discovery (master tracks live workers)
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message PingRequest {}
message PingResponse { string version = 1; string worker_id = 2; }

message CapabilitiesRequest {}
message CapabilitiesResponse {
  repeated string protocols = 1;  // http, ws, grpc, tcp, udp
  int32 max_users = 2;
  int32 max_duration_sec = 3;
  bool supports_tls = 4;
  bool supports_sessions = 5;
}

message RegisterRequest {
  string worker_id = 1;
  string address = 2;  // reachable address of the worker
  CapabilitiesResponse capabilities = 3;
}

message RegisterResponse {
  bool accepted = 1;
  string message = 2;
}