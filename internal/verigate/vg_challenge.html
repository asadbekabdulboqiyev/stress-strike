<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Check — VeriGate</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e8eaf0;
    --muted:#9aa3b2; --accent:#5b8cff; --ok:#3ddc97;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1b2030 0%, var(--bg) 60%);
    color:var(--txt); min-height:100vh; display:grid; place-items:center; padding:24px;
  }
  .card{
    width:min(420px,100%); background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:32px; text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .logo{width:44px; height:44px; margin:0 auto 18px; display:grid; place-items:center;
    border-radius:12px; background:linear-gradient(135deg,#2b3d66,#1c2438); border:1px solid var(--line)}
  h1{font-size:18px; font-weight:600; letter-spacing:.2px}
  p{color:var(--muted); font-size:13.5px; line-height:1.55; margin:8px 0 22px}
  .status{display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:13px; color:var(--muted); min-height:20px}
  .spinner{width:14px; height:14px; border-radius:50%; border:2px solid var(--line);
    border-top-color:var(--accent); animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done .spinner{display:none}
  .done .status{color:var(--ok)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px;
    color:var(--muted); margin-top:18px; word-break:break-all}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8fb0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>
  </div>
  <h1>Security Check</h1>
  <p>VeriGate protection is active on this host. Verifying your browser with a
     proof-of-work challenge&hellip;</p>
  <div class="status"><span class="spinner"></span><span id="msg">Solving challenge&hellip;</span></div>
  <div class="mono" id="meta"></div>
</div>

<script>
(function () {
  var prefix = "{{.Prefix}}";
  var difficulty = {{.Difficulty}};
  var redirect = "{{.Redirect}}";
  var meta = document.getElementById('meta');
  var msg = document.getElementById('msg');
  meta.textContent = 'prefix ' + prefix + ' · zeros ' + difficulty;

  function hex(bytes) {
    var out = '';
    for (var i = 0; i < bytes.length; i++) {
      out += ('0' + bytes[i].toString(16)).slice(-2);
    }
    return out;
  }

  async function sha256Hex(s) {
    var buf = new TextEncoder().encode(s);
    var digest = await crypto.subtle.digest('SHA-256', buf);
    return hex(new Uint8Array(digest));
  }

  var target = '0'.repeat(difficulty);
  var nonce = 0;

  async function solve() {
    for (;;) {
      var h = await sha256Hex(prefix + nonce);
      if (h.indexOf(target) === 0) {
        msg.textContent = 'Verification passed — redirecting&hellip;';
        document.getElementById('card').classList.add('done');
        fetch('/__verigate/solve', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({prefix: prefix, nonce: String(nonce)})
        }).then(function (res) {
          if (!res.ok) { location.href = '/__verigate/challenge?retry=1'; return; }
          location.href = redirect;
        }).catch(function () {
          msg.textContent = 'Connection error — retrying&hellip;';
          setTimeout(solve, 800);
        });
        return;
      }
      nonce++;
      if (nonce % 4096 === 0) {
        msg.textContent = 'Solving challenge&hellip; ' + nonce + ' tries';
        await new Promise(function (r) { setTimeout(r, 0); });
      }
    }
  }
  solve();
})();
</script>
</body>
</html>
