# Windows Package Manager manifest for Sift.
#
# Put this directory in a winget-pkgs fork as:
#   manifests/a/asadbekabdulboqiyev/Sift/0.14.3/Sift.yaml
#   manifests/a/asadbekabdulboqiyev/Sift/0.14.3/
#       Sift.installer.yaml   (see packaging/winget/)
#
# Replace both hashes with the values from checksums.txt in the release.

PackageIdentifier: asadbekabdulboqiyev.Sift
PackageVersion: 0.14.14
DefaultLocale: en-US
ManifestType: installer
InstallerType: zip
License: Apache-2.0
Publisher: asadbekabdulboqiyev
Author: Sift maintainers
Homepage: https://github.com/asadbekabdulboqiyev/Sift
ReleaseNotes: https://github.com/asadbekabdulboqiyev/Sift/releases/tag/v0.14.14
ReleaseNotesUrl: https://github.com/asadbekabdulboqiyev/Sift/releases/tag/v0.14.14
InstallationNotes: |
  Pure Go build: no libpcap, no C runtime, no system dependencies.

  To reach high virtual-user counts, run the distributed worker with a raised
  file-descriptor limit, or use WSL2 with the Linux worker package and:
    LimitNOFILE=1048576
Tags:
  - load-testing
  - performance
  - benchmarking
  - go
ReleaseDate: 2026-10-01T00:00:00Z
Platform:
  - Windows.Desc
  - Windows.X64
Architectures:
  - x64
InstallerSwitches:
  Custom: Sift.exe

Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/asadbekabdulboqiyev/Sift/releases/download/v0.14.14/Sift_0.14.14_windows_amd64.zip
    InstallerSha256: REPLACE_WITH_SHA256_FROM_checksums_txt

FileExtensions:
  - ss
Commands:
  - name: Sift
